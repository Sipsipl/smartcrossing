name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4  # sim.js parity test runs the JS simulation in node
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-interaction
      # CPU torch (same version as the poetry gpu group, CPU wheel) so the set-encoder, behaviour-cloning and
      # torch-parity tests run here too; cuda cases stay skipped (SC_TEST_CUDA unset)
      - name: Install CPU torch
        run: poetry run pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: poetry run pytest -q
