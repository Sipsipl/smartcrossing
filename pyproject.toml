[tool.poetry]
name = "smartcrossing"
version = "0.2.0"
description = "Signal-free intersection crossed by learning autonomous cars"
authors = ["Sipsipl"]
readme = "README.md"
packages = [{include = "smartcrossing"}]

[tool.poetry.dependencies]
python = "^3.13.2"
numpy = "^2.2.4"
pillow = "^11.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
